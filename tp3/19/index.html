<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/gif" href="../media/favicon.gif">
  <link rel="stylesheet" href="styles.css" />
  <title>Registro (ej. 19)</title>
</head>

<body>
  <header>
    <h1>Crear cuenta</h1>
    <p>Completá el registro en dos pasos.</p>
  </header>

  <main>
    <form action="#" method="post" novalidate class="form-registro">

      <!-- radios ocultos: controlan qué paso está visible (truco sin JS) -->
      <input type="radio" name="paso" id="paso1" class="paso-radio" checked>
      <input type="radio" name="paso" id="paso2" class="paso-radio">

      <!-- indicador de progreso, clickeable porque son <label> asociados a los radios -->
      <div class="indicador-pasos">
        <label for="paso1" class="indicador">1. Datos personales</label>
        <label for="paso2" class="indicador">2. Datos de cuenta</label>
      </div>

      <!-- paso 1 -->
      <fieldset class="paso paso-1">
        <legend>Datos personales</legend>

        <div>
          <label for="nombre">Nombre completo:</label>
          <input type="text" id="nombre" name="nombre" placeholder="Ej.: Élver Gómez Torba" required minlength="3"
            autocomplete="name" />
          <span class="ayuda">Ingresá tu nombre y apellido.</span>
        </div>

        <div>
          <label for="email">Correo electrónico:</label>
          <input type="email" id="email" name="email" placeholder="correo@falso.com" required
            autocomplete="email" />
          <span class="ayuda">Ingresá un correo con formato válido.</span>
        </div>

        <div>
          <label for="telefono">Teléfono:</label>
          <input type="tel" id="telefono" name="telefono" placeholder="Ej.: 343 4123456" pattern="[0-9 ]{7,15}"
            required autocomplete="tel" />
          <span class="ayuda">Solo números y espacios, entre 7 y 15 caracteres.</span>
        </div>

        <div class="botones-paso">
          <label for="paso2" class="btn btn-siguiente">Siguiente →</label>
        </div>
      </fieldset>

      <!-- paso 2 -->
      <fieldset class="paso paso-2">
        <legend>Datos de cuenta</legend>

        <div>
          <label for="usuario">Nombre de usuario:</label>
          <input type="text" id="usuario" name="usuario" placeholder="Ej.: elver_g" required minlength="4"
            pattern="[A-Za-z0-9_]+" autocomplete="username" />
          <span class="ayuda">Solo letras, números y guion bajo (mínimo 4 caracteres).</span>
        </div>

        <div>
          <label for="password">Contraseña:</label>
          <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres" required
            minlength="8" autocomplete="new-password" />
          <span class="ayuda">Debe tener al menos 8 caracteres.</span>
        </div>

        <div class="grupo-checkbox">
          <input type="checkbox" id="terminos" name="terminos" required />
          <label for="terminos">Acepto los términos y condiciones.</label>
        </div>

        <div class="botones-paso">
          <label for="paso1" class="btn btn-atras">← Atrás</label>
          <button type="submit" class="btn btn-enviar">Registrarme</button>
        </div>
      </fieldset>

    </form>
  </main>
</body>

</html>
