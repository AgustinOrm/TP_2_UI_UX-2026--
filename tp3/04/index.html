<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/gif" href="../media/favicon.gif">
  <title>Contacto (ej. 4)</title>
</head>

<body>
  <header>
    <h1>Contacto</h1>
    <p>Completá el formulario y te responderemos a la brevedad.</p>
  </header>

  <main>
    <form action="#" method="post" novalidate>

      <!-- Nombre -->
      <div>
        <label for="nombre">Nombre completo:</label>
        <input type="text" id="nombre" name="nombre" placeholder="Ej.: Élver Gómez Torba" required
          autocomplete="name" />
        <span>Ingresá tu nombre y apellido.</span>
      </div>

      <!-- Email -->
      <div>
        <label for="email">Correo electrónico:</label>
        <input type="email" id="email" name="email" placeholder="correo@falso.com" required autocomplete="email" />
        <span>Usaremos este correo solo para responderte.</span>
      </div>

      <!-- Mensaje -->
      <div>
        <label for="mensaje">Mensaje:</label>
        <textarea id="mensaje" name="mensaje" rows="2" placeholder="Escribí tu consulta aquí..." required></textarea>
        <span>Mínimo 20 caracteres.</span>
      </div>

      <!-- Botón de envío -->
      <div>
        <button type="submit">Enviar mensaje</button>
      </div>

    </form>
  </main>
</body>

</html>
